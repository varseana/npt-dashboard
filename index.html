<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="STAR NPT Dashboard: weekly non-productive time tracking and planning for SEPO SAFE-T managers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>STAR NPT Dashboard</title>
    <style>
      html, body { margin: 0; background: #f7f7f5; }

      /* pixel font (Silvester Pixel Demo) para titulos y subtitulos; el cuerpo sigue en Outfit.
         fallback a Outfit por glifo (si al font demo le falta un simbolo como / " ( ) cae a Outfit). */
      @font-face {
        font-family: 'Silvester Pixel';
        src: url('/silvester-pixel.otf') format('opentype');
        font-display: swap;
      }
      /* variante outline disponible por si se quiere usar: font-family: 'Silvester Pixel Outline' */
      @font-face {
        font-family: 'Silvester Pixel Outline';
        src: url('/silvester-pixel-outline.otf') format('opentype');
        font-display: swap;
      }
      h1, h2, h3,
      .npt-title {
        font-family: 'Silvester Pixel', 'Outfit Variable', 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.05em;   /* el pixel font se ve muy pegado; le damos aire */
      }

      /* botones destructivos: hover con transicion suave */
      .npt-btn-remove {
        background: #ffffff; color: #b42318; border: 1px solid #b4231855;
        border-radius: 8px; padding: 6px 10px; font-size: 17px; cursor: pointer; font-weight: 600;
        transition: background .2s ease, color .2s ease, border-color .2s ease;
      }
      .npt-btn-remove:hover:not(:disabled) { background: #b42318; color: #ffffff; border-color: #b42318; }
      .npt-btn-remove:disabled { opacity: .5; cursor: default; }

      .npt-logout {
        background: transparent; border: none; color: #767676; cursor: pointer;
        padding: 2px; display: inline-flex; transition: color .2s ease;
      }
      .npt-logout:hover { color: #b42318; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
