<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="STAR NPT Dashboard: weekly non-productive time tracking and planning for SEPO SAFE-T managers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>STAR NPT Dashboard</title>
    <style>
      html, body { margin: 0; background: #f7f7f5; }

      /* display font (Bargent Disco Demo) para titulos y subtitulos; el cuerpo sigue en Outfit.
         OJO: esta Demo es letters-only (a-z, A-Z); numeros y simbolos (/ " ( ) ? %) caen a Outfit. */
      @font-face {
        font-family: 'Bargent Disco';
        src: url('/bargent-disco.otf') format('opentype');
        font-display: swap;
      }
      /* puntillismo "calado": texto solido gris con puntos transparentes calados (mask),
         sobre la fuente Bargent. Aplica a todos los titulos. */
      h1, h2, h3,
      .npt-title {
        font-family: 'Bargent Disco', 'Outfit Variable', 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.01em;
        color: #5c5c5c;
        -webkit-text-fill-color: #5c5c5c;
        -webkit-mask-image: radial-gradient(circle, transparent 1.2px, #000 1.8px);
        mask-image: radial-gradient(circle, transparent 1.2px, #000 1.8px);
        -webkit-mask-size: 4px 4px;
        mask-size: 4px 4px;
      }

      /* botones destructivos: hover con transicion suave */
      .npt-btn-remove {
        background: #ffffff; color: #b42318; border: 1px solid #b4231855;
        border-radius: 8px; padding: 6px 10px; font-size: 17px; cursor: pointer; font-weight: 600;
        transition: background .2s ease, color .2s ease, border-color .2s ease;
      }
      .npt-btn-remove:hover:not(:disabled) { background: #b42318; color: #ffffff; border-color: #b42318; }
      .npt-btn-remove:disabled { opacity: .5; cursor: default; }

      .npt-logout {
        background: transparent; border: none; color: #767676; cursor: pointer;
        padding: 2px; display: inline-flex; transition: color .2s ease;
      }
      .npt-logout:hover { color: #b42318; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
