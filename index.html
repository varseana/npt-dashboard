<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="STAR NPT Dashboard: weekly non-productive time tracking and planning for SEPO SAFE-T managers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>STAR NPT Dashboard</title>
    <style>
      /* fuente retro de reloj (Digital-7 Mono, Style-7), auto-hosteada en /public. LCD look para el
         reloj del header y el used% del budget card. */
      @font-face {
        font-family: "Digital7";
        src: url("/digital7-mono.ttf") format("truetype");
        font-display: swap;
      }
      /* ===== paleta como CSS variables: light (default) y dark (html.dark) ===== */
      /* LIGHT: off-white + highlights totalmente negros (botones negros, texto blanco) */
      :root {
        --bg: #f7f7f5; --panel: #ffffff; --panelAlt: #efeeec; --border: #e2e1de;
        --text: #111111; --textDim: #767676; --accent: #111111; --accentSoft: #111111;
        --deep: #000000; --over: #111111; --under: #9a9a9a;
        --accent-text: #ffffff;   /* texto sobre botones accent */
        /* paleta Bauhaus (rojo/amarillo/azul/verde) con hex EXACTOS de Sean. Nota: el amarillo ECC412
           como TEXTO sobre off-white tiene contraste bajo (Sean lo prefiere asi vs el dorado que se veia
           "cafe"). azul = token nuevo, disponible aunque no se use aun. */
        --ok: #1c7f46; --okBg: #e4f1e9; --warn: #ecc412; --warnBg: #fbf1cc; --bad: #b0232b; --badBg: #f7e2e4;
        --blue: #0d5c9d; --blueBg: #e3ecf4;
        --clock: #111111;
        --skel1: #e9e8e5; --skel2: #f4f3f1;
      }
      /* DARK: espejo -> fondo casi-negro + highlights totalmente blancos (botones blancos, texto negro) */
      html.dark {
        --bg: #000000; --panel: #171717; --panelAlt: #202020; --border: #2b2b2b;
        --text: #f4f4f2; --textDim: #9a9a9a; --accent: #ffffff; --accentSoft: #f4f4f2;
        --deep: #ffffff; --over: #f4f4f2; --under: #6f6f6f;
        --accent-text: #0d0d0d;   /* texto negro sobre botones blancos */
        /* Bauhaus adaptado a fondo negro: el amarillo va exacto (ECC412 brilla en dark); rojo/verde/azul
           se aclaran respecto al hex de light para tener contraste sobre negro (mismos matices Bauhaus). */
        --ok: #35b368; --okBg: #12261a; --warn: #ecc412; --warnBg: #2b2410; --bad: #e5484d; --badBg: #35191a;
        --blue: #4a9eda; --blueBg: #10263a;
        --clock: #4a9eda;   /* azul Bauhaus para el LCD del reloj en dark (antes verde casio) */
        --skel1: #1c1c1c; --skel2: #262626;
      }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      /* transicion suave y profesional al cambiar de tema (colores/bordes, no layout) */
      *, *::before, *::after {
        transition: background-color .28s ease, color .28s ease, border-color .28s ease, box-shadow .28s ease;
      }

      /* botones destructivos: hover con transicion suave */
      .npt-btn-remove {
        background: var(--panel); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 33%, transparent);
        border-radius: 8px; padding: 6px 10px; font-size: 17px; cursor: pointer; font-weight: 600;
        transition: background .2s ease, color .2s ease, border-color .2s ease;
      }
      .npt-btn-remove:hover:not(:disabled) { background: var(--bad); color: #ffffff; border-color: var(--bad); }
      .npt-btn-remove:disabled { opacity: .5; cursor: default; }

      .npt-logout {
        background: transparent; border: none; color: var(--textDim); cursor: pointer;
        padding: 2px; display: inline-flex; transition: color .2s ease;
      }
      .npt-logout:hover { color: var(--bad); }

      /* asterisco de info: gira sobre su propio eje en loop perfecto (svg simetrico + origen centrado) */
      @keyframes npt-spin { to { transform: rotate(360deg); } }
      .npt-aster { animation: npt-spin 3s linear infinite; transform-origin: 50% 50%; }
      /* hyperlink de storytelling (monocromatico): feedback en hover sin salir del sistema B&N */
      .npt-storylink:hover { color: var(--textDim); }
      /* X de cerrar el popover de info: gris por defecto, roja en hover */
      .npt-close { color: var(--textDim); transition: color .2s ease; }
      .npt-close:hover { color: var(--bad); }
      /* ojo de revelar contrasena: gris por defecto, contraste full en hover */
      .npt-eye { color: var(--textDim); transition: color .2s ease; }
      .npt-eye:hover { color: var(--text); }
      /* iconos de accion sin borde (columna Actions): gris por defecto, contraste en hover. */
      .npt-ico-act { background: transparent; border: none; cursor: pointer; padding: 2px; display: inline-flex; color: var(--textDim); transition: color .2s ease; }
      .npt-ico-act:hover:not(:disabled) { color: var(--text); }
      /* variante destructiva (remove / move out): hover rojo. */
      .npt-ico-danger:hover:not(:disabled) { color: var(--bad); }
      .npt-ico-act:disabled { opacity: .4; cursor: default; }
      /* boton "+" de AddButtonInput: el signo brilla VERDE en claro / AZUL en oscuro al hover. */
      .npt-add-plus { transition: color .2s ease; }
      .npt-add-plus:hover:not(:disabled) { color: var(--ok); }
      html.dark .npt-add-plus:hover:not(:disabled) { color: var(--blue); }
      /* iconos de accion borderless con hover de color Bauhaus (azul / amarillo). el color base va en la
         CLASE (no inline) porque un color inline le GANARIA al :hover del stylesheet. */
      .npt-hover-blue { color: var(--text); transition: color .2s ease; }
      .npt-hover-blue:hover:not(:disabled) { color: var(--blue); }
      .npt-hover-warn { color: var(--text); transition: color .2s ease; }
      .npt-hover-warn:hover:not(:disabled) { color: var(--warn); }
      .npt-hover-blue:disabled, .npt-hover-warn:disabled { opacity: .4; cursor: default; }
      /* ===== edicion inline ===== lectura = texto con lapiz al hover; input = MISMO box, solo el
         borde pasa de transparente a visible. zero layout shift (misma metrica en ambos modos). */
      .npt-inline-field .npt-inline-read {
        box-sizing: border-box; margin: 0; border: 1px solid transparent; border-radius: 8px;
        background: transparent; cursor: text; font-family: inherit; color: var(--text);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        transition: background .15s ease, border-color .15s ease;
      }
      .npt-inline-field:hover .npt-inline-read { background: color-mix(in srgb, var(--text) 7%, transparent); }
      .npt-inline-read:focus-visible { outline: none; border-color: var(--border); }
      .npt-inline-pencil { opacity: 0; color: var(--textDim); transition: opacity .15s ease; }
      .npt-inline-field:hover .npt-inline-pencil { opacity: 1; }
      .npt-inline-input {
        box-sizing: border-box; margin: 0; border: 1px solid var(--border); border-radius: 8px;
        background: var(--panel); color: var(--text); font-family: inherit; outline: none;
      }
      .npt-inline-input:focus { border-color: var(--text); }
      .npt-inline-input:disabled { opacity: .6; }
      /* ===== nav tabs (Dashboard/Team/Access): estilo B1 ===== solido, cero radius, esquina sup-der
         recortada (chaflan 12px). el clip va en el INNER para no recortar el badge (que vive afuera).
         texto corrido 3px a la izquierda (padding left 15 / right 21). */
      .npt-tab { position: relative; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
      .npt-tab-inner {
        display: inline-flex; align-items: center; font-size: 19px; font-weight: 600; line-height: 1.1;
        padding: 9px 21px 9px 15px;
        clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        transition: background .18s ease, color .18s ease;
      }
      .npt-tab-idle { background: var(--panelAlt); color: var(--text); }
      .npt-tab-idle:hover { background: var(--border); }
      .npt-tab-active { background: var(--accent); color: var(--accent-text); }
      /* ===== dropdown custom (D3) ===== reemplaza al <select> nativo para controlar el popup: abre
         HACIA ABAJO y el panel tiene el MISMO ancho que el trigger (wrapper inline-block + panel
         left:0/right:0). sin caja; chevron grueso a la izquierda; fondo achaflanado en hover/abierto. */
      .npt-dd2 { position: relative; display: inline-block; }
      .npt-dd2-trigger {
        position: relative; display: inline-flex; align-items: center; gap: 8px; width: 100%;
        background: transparent; border: none; cursor: pointer; font-family: inherit; font-size: 19px;
        font-weight: 600; color: var(--text); padding: 8px 10px 8px 6px; text-align: left;
        transition: background .18s ease;
      }
      .npt-dd2-trigger:hover, .npt-dd2-open .npt-dd2-trigger {
        background: var(--panelAlt);
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
      }
      .npt-dd2-arrow { display: inline-flex; color: var(--text); pointer-events: none; transition: transform .18s ease; }
      .npt-dd2-open .npt-dd2-arrow { transform: rotate(180deg); }
      .npt-dd2-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .npt-dd2-panel {
        position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
        background: var(--panel); border: 1px solid var(--border); max-height: 320px; overflow-y: auto;
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
      }
      .npt-dd2-opt {
        display: block; width: 100%; text-align: left; background: transparent; border: none;
        cursor: pointer; font-family: inherit; font-size: 18px; color: var(--text); padding: 9px 12px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .12s ease;
      }
      .npt-dd2-opt:hover { background: var(--panelAlt); }
      .npt-dd2-opt-sel { font-weight: 700; background: var(--panelAlt); }
      /* ===== cards con esquina sup-der recortada ===== mismo lenguaje que los botones B1: sharp, cero
         radius, chaflan 16px arriba-derecha. el borde 1px SIGUE el corte via ::before inset (fondo=border
         + relleno panel 1px adentro). el contenido va en .npt-card-cut-body (z-index encima). */
      .npt-card-cut {
        --cardcut: 16px; position: relative; border-radius: 0; background: var(--border);
        clip-path: polygon(0 0, calc(100% - var(--cardcut)) 0, 100% var(--cardcut), 100% 100%, 0 100%);
      }
      .npt-card-cut::before {
        content: ""; position: absolute; inset: 1px; background: var(--panel); z-index: 0;
        clip-path: polygon(0 0, calc(100% - var(--cardcut)) 0, 100% var(--cardcut), 100% 100%, 0 100%);
      }
      .npt-card-cut-body { position: relative; z-index: 1; }
      /* ===== marcos esquineros (budget card sin caja) ===== 4 L simetricas, gruesas, que NO se tocan. */
      .npt-bracket { position: absolute; pointer-events: none; width: 15px; height: 15px; }
      .npt-bracket.tl { top: 0; left: 0; border-top: 3px solid var(--text); border-left: 3px solid var(--text); }
      .npt-bracket.tr { top: 0; right: 0; border-top: 3px solid var(--text); border-right: 3px solid var(--text); }
      .npt-bracket.bl { bottom: 0; left: 0; border-bottom: 3px solid var(--text); border-left: 3px solid var(--text); }
      .npt-bracket.br { bottom: 0; right: 0; border-bottom: 3px solid var(--text); border-right: 3px solid var(--text); }
      /* fuente LCD retro (Digital-7): reloj del header + used% del budget card, nada mas. */
      .npt-lcd { font-family: "Digital7", "DSEG7 Classic", "Consolas", monospace; letter-spacing: 1px; }
      /* oculta el ojo/limpiar NATIVO del navegador (Edge/IE) para no tener doble ojo; dejamos el nuestro */
      input::-ms-reveal, input::-ms-clear { display: none; }
      /* accesibilidad: si el usuario pidio menos movimiento, no giramos */
      @media (prefers-reduced-motion: reduce) { .npt-aster { animation: none; } }
    </style>
    <script>
      // aplica el tema ANTES del paint para evitar flash (no-FOUC). guardado en localStorage,
      // default = preferencia del sistema.
      (function () {
        try {
          // default = CLARO. Solo oscuro si el usuario lo eligio explicitamente antes.
          if (localStorage.getItem("nptTheme") === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
